[package]
name = "codeforge-sentinel"
version = "0.1.0"
description = "CodeForge Sentinel — system-level proctoring companion app"
edition = "2021"

[lib]
# Required by tauri's mobile build target even though Sentinel is desktop-only
# for now (Windows first, per the phased plan) — this is the standard Tauri
# v2 scaffold shape, not mobile-specific code.
name = "codeforge_sentinel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.33"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
# blocking client: the heartbeat loop runs on its own plain OS thread (same
# pattern as watchdog.rs/clipboard.rs), no async runtime needed for one
# periodic POST every 15s.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
# Version pinned to match what tauri 2.11.5 itself depends on (see its
# Cargo.toml) so the HWND type returned by WebviewWindow::hwnd() is the same
# type our own Win32 calls expect — a mismatched windows-crate version would
# make them incompatible despite looking identical.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_DataExchange",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Storage_FileSystem",
] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
