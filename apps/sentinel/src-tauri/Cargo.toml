[package]
name = "codeforge-sentinel"
version = "0.1.0"
description = "CodeForge Sentinel — system-level proctoring companion app"
edition = "2021"

[lib]
# Required by tauri's mobile build target even though Sentinel is desktop-only
# for now (Windows first, per the phased plan) — this is the standard Tauri
# v2 scaffold shape, not mobile-specific code.
name = "codeforge_sentinel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Phase 1 only needs static OS/host info (System::name/os_version/host_name),
# not the process-table scanning this crate will be used for from Phase 2 on.
sysinfo = "0.33"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
