# CodeForge infrastructure.
#
#   docker compose up -d                 -> Postgres + Redis + MinIO + Judge0 (infra only;
#                                           run the API/web on the host with npm)
#   docker compose --profile app up -d   -> additionally builds and runs api, worker, web
#   docker compose --profile app --profile prod up -d --build
#                                         -> the above, plus caddy (reverse proxy + automatic
#                                           HTTPS). Requires APP_DOMAIN/MEDIA_DOMAIN in .env.
#                                           See DEPLOYMENT.md for a full walkthrough.
#
# Network layout (see SECURITY.md):
#   app_net     - core services (Postgres, Redis, MinIO, API, web)
#   judge0_net  - Judge0 and its private DB/Redis. Only the API/worker bridge both
#                 networks; candidate code never runs on app_net and Judge0's isolate
#                 sandbox disables network access inside submissions by default.

name: codeforge

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: codeforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      POSTGRES_DB: codeforge
    ports:
      # Loopback-only: reachable from this host (dev tools, SSH tunnel) but
      # never from the public internet, since nothing outside the docker
      # network needs to reach Postgres directly.
      - "127.0.0.1:5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeforge"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app_net]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    # BullMQ requires noeviction so queued jobs are never evicted under memory pressure
    command: ["redis-server", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [app_net]
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      # Reads the same S3_ACCESS_KEY/S3_SECRET_KEY the api/worker containers
      # use as their S3 credentials (env_file: .env on those services, below)
      # instead of a separate MINIO_ROOT_* pair — one value to set, and it
      # can't drift out of sync with what the app is actually presenting to
      # MinIO's S3-compatible API.
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?set in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?set in .env}
    ports:
      # 9000 (S3 API) is reached by the caddy service over the docker
      # network, not via a published port; both are loopback-only here so an
      # admin can still reach the MinIO console over an SSH tunnel.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    networks: [app_net]
    restart: unless-stopped

  # ---------- Judge0 (sandboxed code execution) ----------
  # NOTE for Docker Desktop / WSL2 users: Judge0's isolate sandbox requires
  # cgroup v1. If submissions fail with an isolate error, see the
  # "Judge0 on Windows" section of the README for the .wslconfig workaround.
  judge0-server:
    image: judge0/judge0:1.13.1
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    ports:
      # Loopback-only in every environment: only the api/worker containers
      # need to reach Judge0, over the internal judge0_net, never the public
      # internet (see SECURITY.md).
      - "127.0.0.1:2358:2358"
    privileged: true
    depends_on:
      - judge0-db
      - judge0-redis
    networks: [judge0_net]
    restart: unless-stopped

  judge0-workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    volumes:
      - ./judge0.conf:/judge0.conf:ro
    privileged: true
    depends_on:
      - judge0-db
      - judge0-redis
    networks: [judge0_net]
    restart: unless-stopped

  judge0-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: judge0
      # Not .env-sourced like postgres/minio above, deliberately: this
      # password is never read anywhere except judge0.conf (a static file
      # mounted read-only into judge0-server/judge0-workers, checked into
      # the repo), and judge0-db has no port published — nothing on app_net,
      # let alone the public internet, can ever reach it. Templating this
      # from .env would need generating judge0.conf at deploy time for a
      # secret with no real external attack surface to defend against.
      POSTGRES_PASSWORD: judge0-db-password
      POSTGRES_DB: judge0
    volumes:
      - judge0_pg_data:/var/lib/postgresql/data
    networks: [judge0_net]
    restart: unless-stopped

  judge0-redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    networks: [judge0_net]
    restart: unless-stopped

  # ---------- Application services (profile: app) ----------
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: [app]
    # Every other setting (S3, email, Judge0 auth token, seed admin, etc.)
    # comes from the repo-root .env; the entries below are the ones that
    # must differ from .env's host-side (localhost) values because inside
    # this container "localhost" means the api container itself, not its
    # sibling services on the docker network.
    env_file:
      - .env
    environment:
      NODE_ENV: production
      API_PORT: 4000
      DATABASE_URL: postgresql://codeforge:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/codeforge
      REDIS_URL: redis://redis:6379
      JUDGE0_URL: http://judge0-server:2358
      WEB_ORIGIN: ${WEB_ORIGIN:?set in .env}
      WORKER_INLINE: "false"
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set in .env}
    ports:
      - "127.0.0.1:4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [app_net, judge0_net]
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    profiles: [app]
    command: ["node", "dist/worker.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://codeforge:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/codeforge
      REDIS_URL: redis://redis:6379
      JUDGE0_URL: http://judge0-server:2358
      WEB_ORIGIN: ${WEB_ORIGIN:?set in .env}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set in .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [app_net, judge0_net]
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    profiles: [app]
    environment:
      API_ORIGIN: http://api:4000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    networks: [app_net]
    restart: unless-stopped

  # ---------- CodeForge HQ (profile: hq) ----------
  # CodeForge's own internal ops console: staff, the client/lead CRM, and
  # deployment provisioning. Fully separate app from everything above (own
  # auth, own logical database inside this same Postgres instance). Not
  # part of a per-client deployment — this only runs on CodeForge's own
  # infra. Before first boot, create the second database once:
  #   docker compose exec postgres psql -U codeforge -c "CREATE DATABASE codeforge_hq"
  hq-api:
    build:
      context: .
      dockerfile: apps/hq-api/Dockerfile
    profiles: [hq]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HQ_API_PORT: 4100
      HQ_DATABASE_URL: postgresql://codeforge:${POSTGRES_PASSWORD:?set in .env}@postgres:5432/codeforge_hq
      HQ_WEB_ORIGIN: ${HQ_WEB_ORIGIN:?set in .env}
      HQ_JWT_ACCESS_SECRET: ${HQ_JWT_ACCESS_SECRET:?set in .env}
      HQ_JWT_REFRESH_SECRET: ${HQ_JWT_REFRESH_SECRET:?set in .env}
      HQ_INGEST_SECRET: ${HQ_INGEST_SECRET:?set in .env}
      HQ_SSH_KEY_ENCRYPTION_SECRET: ${HQ_SSH_KEY_ENCRYPTION_SECRET:?set in .env}
    ports:
      - "127.0.0.1:4100:4100"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app_net]
    restart: unless-stopped

  hq-web:
    build:
      context: .
      dockerfile: apps/hq/Dockerfile
    profiles: [hq]
    environment:
      HQ_API_ORIGIN: http://hq-api:4100
    ports:
      - "127.0.0.1:3100:3100"
    depends_on:
      - hq-api
    networks: [app_net]
    restart: unless-stopped

  # Reverse proxy + automatic HTTPS (Let's Encrypt) for a real deployment.
  # Only the two hostnames it terminates need public DNS: APP_DOMAIN (the
  # recruiter dashboard + candidate test links, proxied to `web`, which in
  # turn proxies /api/* to `api` internally) and MEDIA_DOMAIN (MinIO, since
  # presigned snapshot/screenshot URLs are handed straight to the browser
  # and must resolve publicly). See DEPLOYMENT.md.
  caddy:
    image: caddy:2-alpine
    # Separate from the `app` profile: local/dev containerized runs (a single
    # machine, no real domain) have no use for automatic HTTPS, so this only
    # starts when you explicitly add --profile prod (see DEPLOYMENT.md).
    profiles: [prod]
    environment:
      # Defaults are harmless placeholders: docker-compose interpolates every
      # service's variables up front regardless of active profile, so a
      # plain --profile app run (no --profile prod, caddy never starts)
      # must not hard-fail just because these are unset.
      APP_DOMAIN: ${APP_DOMAIN:-app.localhost}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:-media.localhost}
      # Unset by default: HQ stays loopback-only (see docs/hq-deployment.md)
      # unless an operator explicitly opts in by setting HQ_DOMAIN in .env.
      HQ_DOMAIN: ${HQ_DOMAIN:-hq.localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - minio
      - hq-web
    networks: [app_net]
    restart: unless-stopped

  # Automated daily Postgres backups — previously a "do this yourself on a
  # schedule" line in DEPLOYMENT.md with nothing in the stack actually
  # scheduling or verifying it happened. Same `prod` profile as caddy: local
  # dev has nothing worth backing up on a schedule. Writes gzipped dumps to
  # ./backups on the host (bind-mounted, not a named volume, specifically so
  # `scp`/`rclone`/whatever off-host copy step DEPLOYMENT.md still tells you
  # to set up can just point at a real host path).
  postgres-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    profiles: [prod]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: codeforge
      POSTGRES_USER: codeforge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
    volumes:
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app_net]
    restart: unless-stopped

volumes:
  pg_data:
  redis_data:
  minio_data:
  judge0_pg_data:
  caddy_data:
  caddy_config:

networks:
  app_net:
  judge0_net:
