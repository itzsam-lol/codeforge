# Judge0 configuration (mounted into judge0-server and judge0-workers).
# Reference: https://github.com/judge0/judge0/blob/master/judge0.conf

# --- Database (Judge0's private Postgres on judge0_net) ---
POSTGRES_HOST=judge0-db
POSTGRES_PORT=5432
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=judge0-db-password

# --- Redis (Judge0's private Redis on judge0_net) ---
REDIS_HOST=judge0-redis
REDIS_PORT=6379

# --- Execution limits (defaults; per-submission overrides come from the API) ---
CPU_TIME_LIMIT=5
CPU_EXTRA_TIME=1
WALL_TIME_LIMIT=10
MAX_CPU_TIME_LIMIT=15
MAX_WALL_TIME_LIMIT=30
MEMORY_LIMIT=256000
MAX_MEMORY_LIMIT=512000
MAX_PROCESSES_AND_OR_THREADS=60

# --- Security: never allow submissions to reach the network ---
ENABLE_NETWORK=false
ALLOW_ENABLE_NETWORK=false

# --- Queue ---
COUNT_OF_WORKERS=2
INTERVAL=0.1

# Always on, even though the host port binding is loopback-only (see
# docker-compose.yml): defense-in-depth against any other process on the
# same host, and against the port binding ever being widened by mistake.
# Must match JUDGE0_AUTH_TOKEN in .env exactly.
AUTHN_TOKEN=cf2f3b3dae971aebedfbf74493982246af6073c1b3e33993e781eae53229a682
